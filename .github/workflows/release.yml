name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── 1. Build the React dashboard ──────────────────────────────────────────
  build-dashboard:
    name: Build dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist/

  # ── 2. Build relay (with embedded dashboard) ──────────────────────────────
  build-relay:
    name: Build relay (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: build-dashboard
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: relay/go.sum

      # Inject the built dashboard so go:embed can pick it up
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: relay/internal/web/dist/

      - name: Build relay
        working-directory: relay
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          OUTPUT="taildog-relay_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}"
          go build -tags embed \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o "../dist/${OUTPUT}" .

      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # ── 3. Build client (includes embedded server via go.work) ────────────────
  build-client:
    name: Build client (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: build-dashboard          # needs dashboard for -tags embed
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: client/go.sum

      # Dashboard is embedded via relay/server → relay/internal/web
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: relay/internal/web/dist/

      - name: Build client
        working-directory: client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          OUTPUT="taildog_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}"
          go build -tags embed \
            -ldflags="-s -w -X main.clientVersion=${{ github.ref_name }}" \
            -o "../dist/${OUTPUT}" .

      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # ── 4. Create GitHub Release ───────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-relay, build-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
          pattern: '{relay,client}-*'

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
