name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Node / dashboard ────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build
          # Inject into relay so go:embed picks it up
          cp -r dist ../relay/internal/web/dist

      # ── Go ───────────────────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        env:
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist

          build_relay() {
            local goos=$1 goarch=$2
            local ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            GOOS=$goos GOARCH=$goarch go build \
              -tags embed \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/taildog-relay_${goos}_${goarch}${ext}" \
              ./relay
          }

          build_client() {
            local goos=$1 goarch=$2
            local ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            GOOS=$goos GOARCH=$goarch go build \
              -tags embed \
              -ldflags="-s -w -X main.clientVersion=${VERSION}" \
              -o "dist/taildog_${goos}_${goarch}${ext}" \
              ./client
          }

          for target in \
            "linux amd64" \
            "linux arm64" \
            "darwin amd64" \
            "darwin arm64" \
            "windows amd64"; do
            read -r goos goarch <<< "$target"
            echo "→ relay  $goos/$goarch"
            build_relay  "$goos" "$goarch"
            echo "→ client $goos/$goarch"
            build_client "$goos" "$goarch"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
